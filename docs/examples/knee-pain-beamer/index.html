or": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "portrait": {"kind": "image", "sha256": "34d8c6486cbc7af650c1e7393548446a3ddeed69573baeda6681fe31f760108e", "position": {"left": 80, "top": 220, "width": 300, "height": 260}, "style": {"anchor": 1, "fontSize": 26, "typeface": "Hiragino Sans GB", "color": "#748287", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "author_identity": {"kind": "text", "text": "Emma Pierson\n第一作者\n计算机科学助理教授\n加州大学伯克利分校", "position": {"left": 72, "top": 510, "width": 350, "height": 170}, "style": {"anchor": 1, "fontSize": 22, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "据已发表论文归纳，其研究聚焦群体差异的统计测量及健康与公共卫生建模，关注数据和测量方式怎样影响判断。\n\n2020 年以第一作者发表《交通执法中的群体差异分析》（Nature Human Behaviour）；2021 年以共同第一作者发表《人群流动与传染病传播建模》（Nature）。", "position": {"left": 454, "top": 220, "width": 754, "height": 426}, "style": {"anchor": 1, "fontSize": 25, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "background", "template_slide": 3, "slots": {"major": {"kind": "text", "text": "背景", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "影像分级与疼痛差异", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "传统影像分级与患者疼痛存在失配。既往深度学习研究主要训练模型复现 KL 分级，把医师评分作为学习目标。\n\n本文以患者自报疼痛训练影像模型，再比较两种严重程度指标对群体疼痛差异的解释能力，检验传统分级遗漏的信息。", "position": {"left": 72, "top": 218, "width": 1136, "height": 448}, "style": {"anchor": 1, "fontSize": 27, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "workflow", "template_slide": 5, "slots": {"major": {"kind": "text", "text": "方法", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "研究流程", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "4172 名参与者，训练与开发 2877 人、最终验证 1295 人；按患者划分数据。", "position": {"left": 72, "top": 616, "width": 1136, "height": 72}, "style": {"anchor": 1, "fontSize": 23, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "source_1": {"kind": "image", "sha256": "d03e3c86776e03bce5477859d89bed5267a5ee1b30ff2cc0e565ea7750e5fcde", "position": {"left": 72, "top": 188, "width": 1136, "height": 410}, "style": {"anchor": 1, "fontSize": 26, "typeface": "Hiragino Sans GB", "color": "#748287", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "learning-target", "template_slide": 3, "slots": {"major": {"kind": "text", "text": "方法", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "以疼痛为学习目标", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "模型以膝关节 X 线片为输入，以患者的 KOOS 疼痛评分为主要学习目标。输出 ALG-P，概括影像中与疼痛相关的信息。\n\n这一改动让患者体验参与定义疾病严重程度。随后把 ALG-P 与 KL 分级放进同一套差异分析，检验测量目标的改变带来了多少解释增量。", "position": {"left": 72, "top": 218, "width": 1136, "height": 448}, "style": {"anchor": 1, "fontSize": 27, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "model-training", "template_slide": 3, "slots": {"major": {"kind": "text", "text": "方法", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "影像输入与联合训练", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "每次输入双膝图像，统一目标膝位于图像右侧；使用 ResNet-18 和迁移学习，同时预测疼痛及 19 项影像特征。\n\n疼痛预测误差决定模型选择，影像特征作为辅助学习任务。开发集用于调参，最终合并表现最好的 5 个模型。", "position": {"left": 72, "top": 218, "width": 1136, "height": 448}, "style": {"anchor": 1, "fontSize": 27, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "disparity-analysis", "template_slide": 3, "slots": {"major": {"kind": "text", "text": "方法", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "差异量化", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "先计算群体之间的平均疼痛差距，再分别加入 KLG 或 ALG-P 调整。调整后群体变量的回归系数，表示给定影像严重程度后的剩余差异。\n\n解释比例 =（原始差距 − 调整后差距）÷ 原始差距。用同一问题和同一验证人群，比较两种测量方式保留了多少信息。", "position": {"left": 72, "top": 218, "width": 1136, "height": 448}, "style": {"anchor": 1, "fontSize": 27, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "fair-comparison", "template_slide": 3, "slots": {"major": {"kind": "text", "text": "方法", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "评分对齐", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "KLG 先在训练开发集中按五个等级分别拟合疼痛，再到验证集生成同尺度预测。ALG-P 和 KLG 都接受独立验证集的检验。\n\n进一步把 ALG-P 划成与 KLG 各等级人数一致的五档，比较相同粒度下的表现；并以交互项和分层加权方法检验线性模型的假设。", "position": {"left": 72, "top": 218, "width": 1136, "height": 448}, "style": {"anchor": 1, "fontSize": 27, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "diversity-experiment", "template_slide": 5, "slots": {"major": {"kind": "text", "text": "方法", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "等量数据消融", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "固定训练集规模，比较移除某一人群的模型与保留多样性的模型；后者重复随机抽样 5 次，以分离样本数量与人群构成的影响。", "position": {"left": 72, "top": 616, "width": 1136, "height": 72}, "style": {"anchor": 1, "fontSize": 23, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "source_1": {"kind": "image", "sha256": "7ce2be8a9a4922a93cc40b18a855dd7a3da6a6cb94daf1792848f6f829ec28bc", "position": {"left": 72, "top": 188, "width": 1136, "height": 410}, "style": {"anchor": 1, "fontSize": 26, "typeface": "Hiragino Sans GB", "color": "#748287", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "signal-checks", "template_slide": 4, "slots": {"major": {"kind": "text", "text": "方法", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "信号来源检验", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "逐区遮挡影像，观察疼痛预测变化；热区集中于目标膝及关节间隙周围。\n\n再检验同一人群内部的预测、已知影像特征调整及留站点验证，逐层检查模型信息的来源。", "position": {"left": 72, "top": 224, "width": 560, "height": 432}, "style": {"anchor": 1, "fontSize": 25, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "source_1": {"kind": "image", "sha256": "97d303e2bd5a3e0b983d887b5bf2cf126a5bca96c6e5a21145eaea6cbc5e1479", "position": {"left": 720, "top": 184, "width": 488, "height": 496}, "style": {"anchor": 1, "fontSize": 26, "typeface": "Hiragino Sans GB", "color": "#748287", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "prediction", "template_slide": 5, "slots": {"major": {"kind": "text", "text": "结果", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "疼痛预测", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "验证集 Pearson R² 为 0.16（ALG-P）与 0.10（KLG）；重度疼痛判别 AUC 为 0.69 与 0.64。模型捕捉了额外影像信号。", "position": {"left": 72, "top": 616, "width": 1136, "height": 72}, "style": {"anchor": 1, "fontSize": 23, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "source_1": {"kind": "image", "sha256": "0016efa15ae9a06cd53308b5fd77b545dcafb15733cd01ae3f7800133738f6c0", "position": {"left": 72, "top": 188, "width": 1136, "height": 410}, "style": {"anchor": 1, "fontSize": 26, "typeface": "Hiragino Sans GB", "color": "#748287", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "gap-results", "template_slide": 5, "slots": {"major": {"kind": "text", "text": "结果", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "差异解释", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "种族疼痛差距从 10.6 分，经 KLG 调整后为 9.7 分，经 ALG-P 调整后为 6.1 分；解释比例分别为 9% 与 43%。收入和教育分析方向一致。", "position": {"left": 72, "top": 616, "width": 1136, "height": 72}, "style": {"anchor": 1, "fontSize": 23, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "source_1": {"kind": "image", "sha256": "42a692d1bb8fc6b4072e9e21ac307eb21eef53230f98eef0da37998424706ad4", "position": {"left": 72, "top": 188, "width": 1136, "height": 410}, "style": {"anchor": 1, "fontSize": 26, "typeface": "Hiragino Sans GB", "color": "#748287", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "eligibility", "template_slide": 5, "slots": {"major": {"kind": "text", "text": "结果", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "候选规则模拟", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "在保持严重程度档位人数一致的筛选模拟中，黑人参与者的潜在置换候选膝比例由 11% 变为 22%；变化来自候选膝排序。", "position": {"left": 72, "top": 616, "width": 1136, "height": 72}, "style": {"anchor": 1, "fontSize": 23, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "source_1": {"kind": "image", "sha256": "45028000465b2a60ac59bdba70aba4582923511a3ac1acf5e910a557140c46b7", "position": {"left": 72, "top": 188, "width": 1136, "height": 410}, "style": {"anchor": 1, "fontSize": 26, "typeface": "Hiragino Sans GB", "color": "#748287", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "discussion", "template_slide": 3, "slots": {"major": {"kind": "text", "text": "讨论", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "测量与临床判断", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "本文把“影像严重程度如何定义”纳入了研究问题。面向疼痛学习的指标改变了对群体差异的统计解释，提示传统分级遗漏了部分症状相关信息。\n\n对骨科研究的启发，是让测量指标与患者关心的结局建立直接联系，并检验指标在人群之间的表现。症状、结构和治疗结局共同构成临床评价。", "position": {"left": 72, "top": 218, "width": 1136, "height": 448}, "style": {"anchor": 1, "fontSize": 27, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "highlights", "template_slide": 3, "slots": {"major": {"kind": "text", "text": "亮点", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "学习目标与验证思路", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "本文以患者报告的疼痛构建影像严重程度指标，把学习目标与患者体验直接联系起来。再将 ALG-P 与 KLG 放入同一差异分析，量化传统分级遗漏的信息。\n\n验证设计围绕具体问题展开：等量数据消融分离样本数量与人群构成的影响，评分对齐控制尺度和粒度差别，分层与留站点分析检查模型在不同人群和采集环境中的表现。\n\n多面板原图以固定布局和配色呈现控制条件、五次重复抽样与结果，使读者可以沿着研究问题理解证据，而每一步验证都有明确的解释对象。", "position": {"left": 72, "top": 218, "width": 1136, "height": 448}, "style": {"anchor": 1, "fontSize": 27, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "limitations", "template_slide": 3, "slots": {"major": {"kind": "text", "text": "局限", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 19, "right": 72, "bottom": 12, "left": 72}}}, "minor": {"kind": "text", "text": "预测精度与应用距离", "position": {"left": 72, "top": 124, "width": 1136, "height": 50}, "style": {"anchor": 1, "fontSize": 30, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": true, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}, "body": {"kind": "text", "text": "ALG-P 的 R² 为 0.16，对个体疼痛的解释度较低。它增加了群体差异中的影像信息，但个体预测仍有较大误差，症状评估还包含影像之外的重要因素。\n\n患者留出与留站点验证均来自 OAI 队列。队列的年龄、疾病风险与标准化拍片条件，界定了现有结果覆盖的人群和场景；新机构的病例结构与图像质量可能改变模型表现。\n\n热图定位的是对模型预测敏感的区域，具体组织学对应尚待明确。置换分析以阈值规则下的候选膝比例为结局，实际决策、术后疼痛和并发症属于后续临床评价的核心内容。", "position": {"left": 72, "top": 218, "width": 1136, "height": 448}, "style": {"anchor": 1, "fontSize": 27, "typeface": "Hiragino Sans GB", "color": "#23373B", "bold": false, "italic": false, "alignment": "left", "verticalAlignment": "top", "wrap": "square", "autoFit": "none", "insets": {"top": 0, "right": 0, "bottom": 0, "left": 0}}}}, "fixed_text": [], "fixed_image_count": 0, "background": "rgba(250,250,250,1)"}, {"slide_id": "reflection", "template_slide": 3, "slots": {"major": {"kind": "text", "text": "感想", "position": {"left": 0, "top": 0, "width": 1280, "height": 94}, "style": {"anchor": 1, "fontSize": 42, "typeface": "Hiragino Sans GB", "color": "#FAFAFA", "bold": true, "italic": false, "alignment": "left" ator": "Faculty profile / Biography", "status": "verified", "image_transform": "使用来源页面公开照片，等比例展示。"}, {"source_id": "pierson-policing", "claim": "Emma Pierson以第一作者身份发表：A large-scale analysis of racial disparities in police stops across the United States.", "locator": "文章题名、作者署名、机构及摘要", "status": "verified", "author_identity": "PubMed 作者首位 Emma Pierson，机构为 Stanford Computer Science。；作者伯克利官方个人主页列出该论文，研究履历含 Stanford PhD。"}, {"source_id": "pierson-mobility", "claim": "Emma Pierson以共同第一作者身份发表：Mobility network models of COVID-19 explain inequities and inform reopening.", "locator": "文章题名、作者署名、机构及摘要", "status": "verified", "author_identity": "期刊首页 Emma Pierson 署名带同等贡献标记 9，与 Serina Chang、Pang Wei Koh 并列。；作者官方个人主页列出该论文；论文机构 Stanford Computer Science 与 Microsoft Research 对应其履历。"}, {"source_id": "pierson-policing", "claim": "研究领域：群体差异的统计测量", "locator": "已核对论文的题名与摘要", "status": "verified", "interpretation": "依据作者已发表论文的研究主题归纳。"}, {"source_id": "pierson-mobility", "claim": "研究领域：健康与公共卫生建模", "locator": "已核对论文的题名与摘要", "status": "verified", "interpretation": "依据作者已发表论文的研究主题归纳。"}], "footer": "任职与照片：机构官网（2026-10-18 核对）；研究领域据已发表论文归纳", "subtitle": "简介", "emphasis": "brief", "talk_time_sec": 35, "focus_links": [], "image": "slides/02.png"}, {"id": "background", "section_key": "background", "title": "背景", "subtitle": "影像分级与疼痛差异", "question": "影像分级与疼痛差异", "notes": "膝骨关节炎的影像与症状经常存在失配。2018 年 Tiulpin 等已经用深度学习自动判读 KL 分级，目标是接近专家评分。本文改变了学习目标，直接预测患者报告的疼痛。作者关心的是：同样一张 X 线片，采用另一种测量方式后，原来留在统计模型中的群体疼痛差异会怎样变化。这使研究从自动判读延伸到对既有测量方式的检验。", "layout": {"kind": "prose", "paragraphs": ["传统影像分级与患者疼痛存在失配。既往深度学习研究主要训练模型复现 KL 分级，把医师评分作为学习目标。", "本文以患者自报疼痛训练影像模型，再比较两种严重程度指标对群体疼痛差异的解释能力，检验传统分级遗漏的信息。"]}, "evidence": [{"claim": "既往模型以 KL 分级为学习目标。", "source_id": "tiulpin-2018", "locator": "PubMed Abstract", "status": "verified", "verification_scope": "全文 PDF 第 1–4 页确认；摘要中的同一论断位置保留。"}, {"claim": "本文以 KOOS 疼痛评分为学习目标，再用于群体差异分析。", "source_id": "paper", "locator": "PDF 第 1–2、6 页", "status": "verified"}], "expected_text": ["影像分级与疼痛差异", "影像分级与疼痛差异"], "required_objects": ["text"], "background_coverage": ["progress", "study_question"], "section": "背景", "emphasis": "standard", "talk_time_sec": 55, "focus_links": ["question"], "image": "slides/03.png"}, {"id": "workflow", "section_key": "methods", "title": "方法", "subtitle": "研究流程", "question": "研究流程", "notes": "数据来自 OAI 队列，包含有膝骨关节炎或处于高风险的 45 至 79 岁参与者。基线及 12、24、36、48 个月的数据合并后，每条记录对应某位患者的一侧膝在一个时点的影像与疼痛评分，共 36,369 条记录。训练与开发使用 2,877 人、25,049 条记录；最终验证使用另 1,295 人、11,320 条记录。原图左侧是探索阶段，右侧是模型和分析方案确定后的最终评估。划分以患者为单位，同一人的双膝和随访记录进入同一数据部分；统计区间也按患者聚类处理。这些是本研究验证结果的基础安排。", "layout": {"kind": "source_full", "paragraphs": ["4172 名参与者，训练与开发 2877 人、最终验证 1295 人；按患者划分数据。"]}, "evidence": [{"claim": "OAI 45–79 岁；五个时点；4,172 人、36,369 条记录；训练开发 2,877/25,049；验证 1,295/11,320。", "source_id": "paper", "locator": "PDF 第 1–2、6、10 页；Table 1、Extended Data Figure 2", "status": "verified", "analysis_unit": "膝—时间点；划分和区间按患者聚类", "denominator": "4,172 名患者；36,369 条记录"}], "expected_text": ["研究流程", "研究流程"], "required_objects": ["text", "image"], "source_images": [{"file": "assets/workflow.png", "sha256": "d03e3c86776e03bce5477859d89bed5267a5ee1b30ff2cc0e565ea7750e5fcde", "source_id": "paper", "locator": "Extended Data Figure 2：Analysis pipeline", "kind": "figure", "origin": "pdf_crop", "source_pdf": "source/article.pdf", "source_pdf_sha256": "a530600847b2b0045c4701bad2808e940c0bea0749001d119fd274380a692870", "page": 10, "page_size_points": [595.276, 790.866], "crop_points": [42, 57, 554, 268], "dpi": 600, "pixel_size": [4267, 1758], "captured_at": "2026-10-18", "transform": "从原始 PDF 直接裁切，保留原始表头、数值和脚注。", "source_url": "https://cs.stanford.edu/people/jure/pubs/pain-nature_medicine21.pdf"}], "method_coverage": ["workflow", "participants"], "section": "方法", "emphasis": "standard", "talk_time_sec": 65, "focus_links": ["method"], "image": "slides/04.png"}, {"id": "learning-target", "section_key": "methods", "title": "方法", "subtitle": "以疼痛为学习目标", "question": "以疼痛为学习目标", "notes": "这项研究最值得展开的方法变化，是它怎样选择学习目标。既往的膝关节影像模型通常学习医师给出的 KL 等级，衡量成功的标准是与阅片结果一致。本文让模型学习患者自己的 KOOS 疼痛评分：分值范围是零到一百，分数越低表示疼痛越重。得到的 ALG-P 仍然仅由影像生成，代表影像中与患者症状相关的统计信息。这样，模型有机会捕捉常规分级之外、却与疼痛相关的影像特征。接下来的关键步骤，是把新指标带回群体差异分析，观察换一种测量方法会怎样改变对疼痛差异的解释。这里的方法贡献落在学习目标和测量问题的结合；网络结构使用的是成熟组件。", "layout": {"kind": "prose", "paragraphs": ["模型以膝关节 X 线片为输入，以患者的 KOOS 疼痛评分为主要学习目标。输出 ALG-P，概括影像中与疼痛相关的信息。", "这一改动让患者体验参与定义疾病严重程度。随后把 ALG-P 与 KL 分级放进同一套差异分析，检验测量目标的改变带来了多少解释增量。"]}, "evidence": [{"claim": "模型主要预测 KOOS 疼痛；输入仅为 X 线；KOOS 0–100，低分为更重疼痛。", "source_id": "paper", "locator": "PDF 第 6 页 / Study outcomes、Neural network training", "status": "verified", "interpretation": "方法贡献在于以患者结局构建影像测量，并检验既有分级的解释范围。"}, {"claim": "既往自动诊断模型训练目标为 KL 分级。", "source_id": "tiulpin-2018", "locator": "Abstract", "status": "verified", "verification_scope": "全文 PDF 第 1–4 页确认；摘要中的同一论断位置保留。"}], "expected_text": ["以疼痛为学习目标", "以疼痛为学习目标"], "required_objects": ["text"], "method_coverage": ["interventions", "outcomes"], "section": "方法", "emphasis": "core", "talk_time_sec": 110, "focus_links": ["method"], "image": "slides/05.png"}, {"id": "model-training", "section_key": "methods", "title": "方法", "subtitle": "影像输入与联合训练", "question": "影像输入与联合训练", "notes": "输入是双膝固定屈曲位 X 线片。作者保留双膝，是因为两侧不对称可能携带疼痛信息；通过左右翻转，统一把预测目标放在图像右侧。图像标准化并缩放到 1,024 乘 1,024 像素。训练采用 ImageNet 预训练的 ResNet-18，在 OAI 上微调。损失函数同时包含疼痛误差与 19 项影像特征误差，辅助任务引导网络学习医学上相关的影像表征。这些医师特征用于训练监督，预测时输入仍是影像。超参数选择和早停依据开发集的疼痛 RMSE，最后集成表现最好的五个模型。联合学习在这里服务于结局导向的测量构建。", "layout": {"kind": "prose", "paragraphs": ["每次输入双膝图像，统一目标膝位于图像右侧；使用 ResNet-18 和迁移学习，同时预测疼痛及 19 项影像特征。", "疼痛预测误差决定模型选择，影像特征作为辅助学习任务。开发集用于调参，最终合并表现最好的 5 个模型。"]}, "evidence": [{"claim": "输入、翻转、标准化、ResNet-18、KOOS 和 19 项辅助影像任务、开发集 RMSE、5 模型集成。", "source_id": "paper", "locator": "PDF 第 6 页 / Radiological images and preprocessing、Neural network training", "status": "verified"}], "expected_text": ["影像输入与联合训练", "影像输入与联合训练"], "required_objects": ["text"], "method_coverage": ["interventions"], "section": "方法", "emphasis": "standard", "talk_time_sec": 70, "focus_links": ["method"], "image": "slides/06.png"}, {"id": "disparity-analysis", "section_key": "methods", "title": "方法", "subtitle": "差异量化", "question": "差异量化", "notes": "这一步把影像预测接到临床研究问题上。作者先计算两个群体的平均疼痛差距，再拟合包含群体变量和严重程度指标的线性模型。严重程度依次使用 KLG 和 ALG-P；群体变量的系数就是控制该严重程度后的剩余疼痛差异。解释比例按原始差距减去调整后差距，再除以原始差距计算。以论文的种族比较为例，原始差距为 10.6 个 KOOS 点，加入 KLG 后为 9.7，加入 ALG-P 后为 6.1。根据原文未舍入的估计，解释比例分别是百分之九和百分之四十三。这个分析量衡量测量方式对统计差异解释的贡献。研究中患者实际报告的疼痛值保持原样，减少的是模型调整后的剩余差异。线性回归在这里是成熟工具，方法思路在于用新的影像测量重新检验差异来源。", "layout": {"kind": "prose", "paragraphs": ["先计算群体之间的平均疼痛差距，再分别加入 KLG 或 ALG-P 调整。调整后群体变量的回归系数，表示给定影像严重程度后的剩余差异。", "解释比例 =（原始差距 − 调整后差距）÷ 原始差距。用同一问题和同一验证人群，比较两种测量方式保留了多少信息。"]}, "evidence": [{"claim": "群体差异定义为均值差或调整严重程度后的群体回归系数；比例按原始差距缩减量计算。", "source_id": "paper", "locator": "PDF 第 6–7 页 / Quantifying pain disparities；第 3 页 Table 2", "status": "verified", "denominator": "验证集 1,295 人、11,320 条记录", "uncertainty": "按患者聚类计算 95% CI", "interpretation": "统计解释比例与患者实际疼痛变化是不同的研究量。"}], "expected_text": ["差异量化", "差异量化"], "required_objects": ["text"], "method_coverage": ["statistics"], "section": "方法", "emphasis": "core", "talk_time_sec": 110, "focus_links": ["method"], "image": "slides/07.png"}, {"id": "fair-comparison", "section_key": "methods", "title": "方法", "subtitle": "评分对齐", "question": "评分对齐", "notes": "比较两种指标时，一个重要问题是如何让比较公平。KLG 是五档等级，ALG-P 是连续预测，二者的尺度和灵活程度不同。作者先在训练开发集中用分类形式的 KLG 拟合疼痛，各等级有自己的系数，再把这个映射用于留出的验证集。这样，两种指标都在训练开发集完成学习，在同一验证集接受评估。随后，作者把 ALG-P 也划成五档，并使每档人数与 KLG 对应档相同，用这个版本重复分析，检验连续评分的粒度优势。针对群体与严重程度之间关系可能不同的问题，又检验了交互项，并按严重程度分层计算群体差距后加权汇总。各分析围绕同一个问题展开：新增解释量究竟来自新的影像信息，还是来自比较规则。", "layout": {"kind": "prose", "paragraphs": ["KLG 先在训练开发集中按五个等级分别拟合疼痛，再到验证集生成同尺度预测。ALG-P 和 KLG 都接受独立验证集的检验。", "进一步把 ALG-P 划成与 KLG 各等级人数一致的五档，比较相同粒度下的表现；并以交互项和分层加权方法检验线性模型的假设。"]}, "evidence": [{"claim": "KLG 按分类变量在训练开发集用 Lasso 拟合疼痛；ALG-P 五档匹配 KLG 档位人数；交互项与分层加权稳健性分析。", "source_id": "paper", "locator": "PDF 第 6–7 页 / Quantifying pain disparities、Robustness check: ALG-P is not merely a more granular KLG", "status": "verified", "interpretation": "通过尺度、粒度和模型假设的对应检查，提高两种严重程度指标的可比性。"}], "expected_text": ["评分对齐", "评分对齐"], "required_objects": ["text"], "method_coverage": ["statistics"], "section": "方法", "emphasis": "core", "talk_time_sec": 100, "focus_links": ["method"], "image": "slides/08.png"}, {"id": "diversity-experiment", "section_key": "methods", "title": "方法", "subtitle": "等量数据消融", "question": "等量数据消融", "notes": "作者进一步追问，新指标为什么能解释更多疼痛差异。实验改变训练集的人群构成：一类训练集移除全部黑人参与者，另一类从非黑人参与者中随机移除同样数量的人，使两类训练集规模一致。第二种抽样重复五次，收入和教育人群也按同样思路分析。随后用相同验证框架比较预测表现和差异解释能力。图中蓝点表示 KLG，红点表示移除了目标人群的模型，黑点表示五次等规模、多样化训练的模型。保持样本规模一致，使比较聚焦人群构成本身。原文中，移除黑人参与者后的模型解释增量为 KLG 的 2.3 倍，多样化训练集的平均值为 4.9 倍。这个消融实验为训练数据的代表性提供了具体检验，属于验证设计的优点。", "layout": {"kind": "source_full", "paragraphs": ["固定训练集规模，比较移除某一人群的模型与保留多样性的模型；后者重复随机抽样 5 次，以分离样本数量与人群构成的影响。"]}, "evidence": [{"claim": "移除目标人群与等规模移除非目标人群比较；后者五次随机抽样；黑人样本消融 2.3× 对平均 4.9×。", "source_id": "paper", "locator": "PDF 第 2–3、9 页；Extended Data Figure 1", "status": "verified", "interpretation": "在相同样本量下检验训练人群构成，与单纯增大样本量分开。"}], "expected_text": ["等量数据消融", "等量数据消融"], "required_objects": ["text", "image"], "source_images": [{"file": "assets/diversity.png", "sha256": "7ce2be8a9a4922a93cc40b18a855dd7a3da6a6cb94daf1792848f6f829ec28bc", "source_id": "paper", "locator": "Extended Data Figure 1：训练集构成消融", "kind": "figure", "origin": "pdf_crop", "source_pdf": "source/article.pdf", "source_pdf_sha256": "a530600847b2b0045c4701bad2808e940c0bea0749001d119fd274380a692870", "page": 9, "page_size_points": [595.276, 790.866], "crop_points": [42, 54, 554, 284], "dpi": 600, "pixel_size": [4267, 1917], "captured_at": "2026-10-18", "transform": "从原始 PDF 直接裁切，保留原始表头、数值和脚注。", "source_url": "https://cs.stanford.edu/people/jure/pubs/pain-nature_medicine21.pdf"}], "method_coverage": ["statistics"], "section": "方法", "emphasis": "core", "talk_time_sec": 110, "focus_links": ["method", "visual"], "image": "slides/09.png"}, {"id": "signal-checks", "section_key": "methods", "title": "方法", "subtitle": "信号来源检验", "question": e": "assets/table-2.png", "sha256": "42a692d1bb8fc6b4072e9e21ac307eb21eef53230f98eef0da37998424706ad4", "source_id": "paper", "locator": "Table 2：疼痛差异及统计调整结果", "kind": "table", "origin": "pdf_crop", "source_pdf": "source/article.pdf", "source_pdf_sha256": "a530600847b2b0045c4701bad2808e940c0bea0749001d119fd274380a692870", "page": 3, "page_size_points": [595.276, 790.866], "crop_points": [42, 51, 554, 229], "dpi": 600, "pixel_size": [4267, 1483], "captured_at": "2026-10-18", "transform": "从原始 PDF 直接裁切，保留原始表头、数值和脚注。", "source_url": "https://cs.stanford.edu/people/jure/pubs/pain-nature_medicine21.pdf"}], "section": "结果", "emphasis": "standard", "talk_time_sec": 75, "focus_links": ["interpretation"], "image": "slides/12.png"}, {"id": "eligibility", "section_key": "results", "title": "结果", "subtitle": "候选规则模拟", "question": "候选规则模拟", "notes": "作者还进行了一个规则模拟：将严重疼痛与较高 KLG 组合，识别潜在置换候选膝，再把 KLG 换为人数分布相同的 ALG-P 档位。分析限于基线，排除了已有膝手术史的膝。黑人参与者潜在入选的膝比例从百分之十一变成百分之二十二，低收入和低教育人群也上升。两种指标把相同数量的膝分到较重等级，变化发生在具体哪些膝进入候选范围。这说明严重程度的测量选择会影响模拟规则下的人群构成；本文在这一部分报告的是筛选结果。", "layout": {"kind": "source_full", "paragraphs": ["在保持严重程度档位人数一致的筛选模拟中，黑人参与者的潜在置换候选膝比例由 11% 变为 22%；变化来自候选膝排序。"]}, "evidence": [{"claim": "基线、排除既往膝手术，严重疼痛 KOOS≤86.1，KLG≥3 或同等分位 ALG-P≥3；黑人候选膝 11%→22%。", "source_id": "paper", "locator": "PDF 第 4、7 页；Table 3、Allocation of arthroplasty", "status": "verified", "analysis_unit": "膝", "uncertainty": "11%（7–15%）与22%（17–27%）", "interpretation": "基于规则的候选膝模拟；未开展算法指导治疗的前瞻性干预。"}], "expected_text": ["候选规则模拟", "候选规则模拟"], "required_objects": ["text", "image"], "source_images": [{"file": "assets/table-3.png", "sha256": "45028000465b2a60ac59bdba70aba4582923511a3ac1acf5e910a557140c46b7", "source_id": "paper", "locator": "Table 3：置换候选规则模拟", "kind": "table", "origin": "pdf_crop", "source_pdf": "source/article.pdf", "source_pdf_sha256": "a530600847b2b0045c4701bad2808e940c0bea0749001d119fd274380a692870", "page": 4, "page_size_points": [595.276, 790.866], "crop_points": [42, 54, 293, 211], "dpi": 600, "pixel_size": [2092, 1308], "captured_at": "2026-10-18", "transform": "从原始 PDF 直接裁切，保留原始表头、数值和脚注。", "source_url": "https://cs.stanford.edu/people/jure/pubs/pain-nature_medicine21.pdf"}], "section": "结果", "emphasis": "standard", "talk_time_sec": 50, "focus_links": ["interpretation"], "image": "slides/13.png"}, {"id": "discussion", "section_key": "discussion", "title": "讨论", "subtitle": "测量与临床判断", "question": "测量与临床判断", "notes": "这篇研究的意义在于把测量方式本身拿来检验。过去看到同等级影像下仍有明显疼痛差异，解释往往转向影像之外的因素；本文显示，改用面向疼痛训练的影像指标后，模型中的剩余差距明显缩小。由此得到的研究启发，是先审视我们选用的严重程度指标保留了哪些信息，再解释剩余差异。在自己的课题中，可以把患者报告结局作为独立目标，比较新旧指标，并检验不同人群的表现。临床治疗评价还应连接症状、结构及实际治疗后的结局。", "layout": {"kind": "prose", "paragraphs": ["本文把“影像严重程度如何定义”纳入了研究问题。面向疼痛学习的指标改变了对群体差异的统计解释，提示传统分级遗漏了部分症状相关信息。", "对骨科研究的启发，是让测量指标与患者关心的结局建立直接联系，并检验指标在人群之间的表现。症状、结构和治疗结局共同构成临床评价。"]}, "evidence": [{"claim": "新影像严重程度指标对疼痛差异有更高解释比例。", "source_id": "paper", "locator": "PDF 第 1–4 页", "status": "verified", "interpretation": "汇报者分析：指标定义是研究问题的一部分，结局导向的测量可用于检验既有分级的解释范围。"}], "expected_text": ["测量与临床判断", "测量与临床判断"], "required_objects": ["text"], "section": "讨论", "emphasis": "standard", "talk_time_sec": 65, "focus_links": ["interpretation"], "image": "slides/14.png"}, {"id": "highlights", "section_key": "advantages", "title": "亮点", "subtitle": "学习目标与验证思路", "question": "学习目标与验证思路", "notes": "本文的方法贡献首先体现在测量目标的选择。作者让患者报告的疼痛成为主要监督目标，再用影像生成的新指标检验传统 KL 分级的解释范围。这将临床症状与影像测量直接连接起来。第二个亮点是验证设计贴合问题。等量数据消融保持训练集规模一致，把人群构成的影响单独拿出来分析；评分对齐和五档比较检验尺度与粒度，分层和留站点分析则检验不同人群及采集环境中的表现。每项分析都对应一个具体解释，形成了连续的验证链。图表表达也服务于这条逻辑。扩展图一用固定行列和配色呈现对照条件与五次重复结果，读者可以同时看清实验怎样设置、结果是否一致。这些做法值得迁移到自己的结局预测和影像研究中。", "layout": {"kind": "prose", "paragraphs": ["本文以患者报告的疼痛构建影像严重程度指标，把学习目标与患者体验直接联系起来。再将 ALG-P 与 KLG 放入同一差异分析，量化传统分级遗漏的信息。", "验证设计围绕具体问题展开：等量数据消融分离样本数量与人群构成的影响，评分对齐控制尺度和粒度差别，分层与留站点分析检查模型在不同人群和采集环境中的表现。", "多面板原图以固定布局和配色呈现控制条件、五次重复抽样与结果，使读者可以沿着研究问题理解证据，而每一步验证都有明确的解释对象。"]}, "evidence": [{"claim": "疼痛监督目标、差异量化、等量消融与稳健性设计。", "source_id": "paper", "locator": "PDF 第 2–3、6–10 页", "status": "verified", "interpretation": "汇报者判断：主要方法贡献为结局导向的测量及差异分析；消融与对应验证属于执行质量，固定布局与配色属于表达质量。"}], "expected_text": ["学习目标与验证思路", "学习目标与验证思路"], "required_objects": ["text"], "section": "亮点", "emphasis": "standard", "talk_time_sec": 75, "focus_links": ["method", "visual"], "image": "slides/15.png"}, {"id": "limitations", "section_key": "disadvantages", "title": "局限", "subtitle": "预测精度与应用距离", "question": "预测精度与应用距离", "notes": "局限首先是个体预测精度。ALG-P 对疼痛的 R 平方为 0.16，比传统分级提供了更多信息，但个体疼痛中仍有较大比例的变异未被解释。它在本文中最直接的作用，是帮助研究者重新理解群体平均差异。其次，训练、患者留出和留站点验证都来自 OAI。这个队列纳入有骨关节炎或处于高风险的中老年人，影像也按标准化方式采集，因此病例结构、疾病谱与拍片质量是理解适用范围的关键。第三，模型解释和临床应用仍有各自的具体问题。遮挡热图显示了敏感区域，组织层面的对应关系需要更直接的测量；置换分析则按固定阈值模拟哪些膝进入候选范围。真实应用评价应把医生决策、患者症状变化与治疗风险作为明确结局，进一步检验这个测量工具的实际价值。", "layout": {"kind": "prose", "paragraphs": ["ALG-P 的 R² 为 0.16，对个体疼痛的解释度较低。它增加了群体差异中的影像信息，但个体预测仍有较大误差，症状评估还包含影像之外的重要因素。", "患者留出与留站点验证均来自 OAI 队列。队列的年龄、疾病风险与标准化拍片条件，界定了现有结果覆盖的人群和场景；新机构的病例结构与图像质量可能改变模型表现。", "热图定位的是对模型预测敏感的区域，具体组织学对应尚待明确。置换分析以阈值规则下的候选膝比例为结局，实际决策、术后疼痛和并发症属于后续临床评价的核心内容。"]}, "evidence": [{"claim": "同一 OAI 队列、个体解释度低、组织信号解释问题、置换规则模拟。", "source_id": "paper", "locator": "PDF 第 4 页 / Study limitations；第 7–8 页 / Allocation、site validation", "status": "verified", "interpretation": "适用范围由队列与采集方式界定；统计解释、个体预测与治疗决策分别有对应的评价任务。"}], "expected_text": ["预测精度与应用距离", "预测精度与应用距离"], "required_objects": ["text"], "section": "局限", "emphasis": "standard", "talk_time_sec": 85, "focus_links": [], "image": "slides/16.png"}, {"id": "reflection", "section_key": "reflection", "section": "感想", "title": "感想", "question": "选择一个方向，结合自己的研究问题填写。", "notes": "感想方向包括结局导向的影像模型、训练样本代表性、我的课题中的测量偏差。选择一个方向，结合自己的研究问题填写。填写内容依次为“最值得借鉴的方法”、“与我的课题的联系”、“我会怎样验证”。", "expected_text": ["最值得借鉴的方法", "与我的课题的联系", "我会怎样验证", "选题方向"], "required_objects": ["text"], "layout": {"kind": "reflection"}, "reflection": {"directions": ["结局导向的影像模型", "训练样本代表性", "我的课题中的测量偏差"], "guidance": "选择一个方向，结合自己的研究问题填写。", "prompts": [{"id": "finding", "label": "最值得借鉴的方法", "hint": "写清本文改了哪一步、解决了什么问题。"}, {"id": "connection", "label": "与我的课题的联系", "hint": " <script>
'use strict';
const D=JSON.parse(document.getElementById('deck-data').textContent);
const $=id=>document.getElementById(id), el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const stateNames={verified:'已回查原文',partial:'部分可核查',unverified:'待核查',conflict:'存在冲突',test_fixture:'演示素材'};
const reviewNames={passed:'通过',issues:'发现问题',not_checked:'待核查'};
const storageKey='medical-slide-review:v1:'+D.deck.id+':'+D.bundle_id;
let page=0,activeTab='notes',comments=Object.create(null),reflections=Object.create(null),saveError='',toastTimer;
const sourceMap=new Map(D.sources.map(s=>[s.id,s]));
function imageOnlyCover(s){return s.section_key==='cover'&&s.layout?.kind==='paper_cover'&&['source_image','editable_title'].includes(s.layout?.title_mode);}
function slideTitle(s){return imageOnlyCover(s)?'封面':s.subtitle?s.title+'：'+s.subtitle:s.title;}
function message(text){$('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',6500);}
function askConfirm(text){const dialog=$('confirm-dialog');if(dialog.open)return Promise.resolve(false);$('confirm-message').textContent=text;dialog.returnValue='cancel';return new Promise(resolve=>{dialog.addEventListener('close',()=>resolve(dialog.returnValue==='accept'),{once:true});dialog.showModal();$('confirm-cancel').focus();});}
$('confirm-cancel').addEventListener('click',()=>$('confirm-dialog').close('cancel'));
$('confirm-accept').addEventListener('click',()=>$('confirm-dialog').close('accept'));
function validateComments(items){
 if(!Array.isArray(items)||items.length>D.slides.length)throw Error('修改清单页数无效');
 const out=Object.create(null),ids=new Set(D.slides.map(s=>s.id));
 for(const item of items){if(!item||typeof item!=='object'||!ids.has(item.slide_id)||Object.hasOwn(out,item.slide_id)||typeof item.text!=='string'||item.text.length>20000||!['open','resolved'].includes(item.status)||typeof item.updated_at!=='string'||!Number.isFinite(Date.parse(item.updated_at)))throw Error('修改清单包含无效或重复的页面记录');out[item.slide_id]={slide_id:item.slide_id,text:item.text,status:item.status,updated_at:item.updated_at};}
 return out;
}
function validateReflections(items=[]){
 if(!Array.isArray(items)||items.length>D.slides.length)throw Error('感想记录格式无效');
 const out=Object.create(null),forms=new Map(D.slides.filter(s=>s.reflection).map(s=>[s.id,s.reflection]));
 for(const item of items){
  const form=forms.get(item?.slide_id);
  if(!form||Object.hasOwn(out,item.slide_id)||typeof item.direction!=='string'||(item.direction&&!form.directions.includes(item.direction))||typeof item.custom_topic!=='string'||item.custom_topic.length>300||!item.answers||Array.isArray(item.answers)||typeof item.answers!=='object'||typeof item.updated_at!=='string'||!Number.isFinite(Date.parse(item.updated_at)))throw Error('感想记录包含无效页面或方向');
  const answers=Object.create(null),ids=new Set(form.prompts.map(p=>p.id));
  for(const [id,value]of Object.entries(item.answers)){if(!ids.has(id)||typeof value!=='string'||value.length>4000)throw Error('感想填写项无效');answers[id]=value;}
  out[item.slide_id]={slide_id:item.slide_id,direction:item.direction,custom_topic:item.custom_topic,answers,updated_at:item.updated_at};
 }
 return out;
}
try{const saved=localStorage.getItem(storageKey);if(saved){const parsed=JSON.parse(saved);if(parsed.bundle_id!==D.bundle_id)throw Error();const restoredComments=validateComments(parsed.comments),restoredReflections=validateReflections(parsed.reflections);comments=restoredComments;reflections=restoredReflections;}}catch{saveError='本地记录读取异常，可导入 JSON 恢复。';}
function reflectionEntries(){return D.slides.flatMap((s,i)=>{const r=reflections[s.id];return r&&(r.direction||r.custom_topic.trim()||Object.values(r.answers).some(x=>x.trim()))?[{...r,slide_number:i+1,slide_title:slideTitle(s)}]:[];});}
function renderReflection(){
 const s=D.slides[page],form=s.reflection,root=$('reflection-form');root.replaceChildren();root.hidden=!form;if(!form)return;
 const saved=reflections[s.id]||{direction:'',custom_topic:'',answers:{}};
 root.append(el('h3','填写我的感想'),el('p',form.guidance,'hint'));
 const directionLabel=el('label','选题方向');directionLabel.htmlFor='reflection-direction';const select=el('select');select.id='reflection-direction';const blank=el('option','选择方向（选填）');blank.value='';select.append(blank);for(const direction of form.directions){const option=el('option',direction);option.value=direction;select.append(option);}select.value=saved.direction;root.append(directionLabel,select);
 const topicLabel=el('label','自定主题（选填）');topicLabel.htmlFor='reflection-topic';const topic=el('input');topic.id='reflection-topic';topic.maxLength=300;topic.value=saved.custom_topic;root.append(topicLabel,topic);
 for(const prompt of form.prompts){const label=el('label',prompt.label);label.htmlFor='reflection-'+prompt.id;const area=el('textarea');area.id='reflection-'+prompt.id;area.dataset.promptId=prompt.id;area.maxLength=4000;area.value=saved.answers[prompt.id]||'';area.setAttribute('aria-describedby','reflection-hint-'+prompt.id);const hint=el('p',prompt.hint,'hint');hint.id='reflection-hint-'+prompt.id;root.append(label,hint,area);area.addEventListener('input',editReflection);}
 const status=el('p',saveError||(reflections[s.id]?'感想已保存到本机浏览器':'填写后自动保存到本机浏览器'),'save-state');status.id='reflection-save-status';status.setAttribute('role','status');root.append(status,el('p','填写内容随修改清单导出，下一次生成时写入 PPT。','hint'));
 const exportButton=el('button','导出感想与修改清单');exportButton.addEventListener('click',exportJSON);root.append(exportButton);select.addEventListener('change',editReflection);topic.addEventListener('input',editReflection);
}
function editReflection(){const s=D.slides[page],answers=Object.create(null);for(const prompt of s.reflection.prompts)answers[prompt.id]=$('reflection-'+prompt.id).value;reflections[s.id]={slide_id:s.id,direction:$('reflection-direction').value,custom_topic:$('reflection-topic').value,answers,updated_at:new Date().toISOString()};persist();}

function entries(){return D.slides.flatMap((s,i)=>comments[s.id]?.text.trim()?[{...comments[s.id],slide_number:i+1,slide_title:slideTitle(s)}]:[]);}
function exportObject(){return {schema_version:1,deck_id:D.deck.id,deck_title:D.deck.title,version:D.deck.version,bundle_id:D.bundle_id,pptx_sha256:D.pptx_sha256,exported_at:new Date().toISOString(),comments:entries(),reflections:reflectionEntries()};}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(exportObject()));saveError='';}catch{saveError='保存失败，请导出 JSON 备份。';}updateSave();updateCount();renderNav();}
function updateSave(){if($('reflection-save-status'))$('reflection-save-status').textContent=saveError||'感想已保存到本机浏览器';const current=comments[D.slides[page].id];$('save-status').textContent=saveError||(current?.text?'已保存到本机浏览器':'填写后自动保存在本机浏览器');$('save-status').style.color=saveError?'var(--danger)':'';}
function updateCount(){const all=entries(),done=all.filter(x=>x.status==='resolved').length;$('feedback-count').textContent=`共 ${all.length} 页有意见，其中 ${done} 页标记已处理`;}
function renderNav(){const list=$('slide-list'),sidebar=list.parentElement,oldTop=sidebar.scrollTop,oldLeft=list.scrollLeft,focused=document.activeElement?.dataset.slideId;list.replaceChildren();const q=$('search').value.trim().toLocaleLowerCase();let section='',count=0;D.slides.forEach((s,i)=>{const hay=[slideTitle(s),s.section,s.question,...(s.expected_text||[])].join(' ').toLocaleLowerCase();if(q&&!hay.includes(q))return;count++;if(s.section!==section){list.append(el('div',s.section,'section-label'));section=s.section;}const btn=el('button',undefined,'slide-link');btn.type='button';btn.setAttribute('aria-label',`第 ${i+1} 页：${slideTitle(s)}`);btn.setAttribute('aria-current',String(i===page));btn.dataset.slideId=s.id;const img=el('img');img.src=s.image;img.alt='';img.loading='lazy';btn.append(img);const line=el('span',undefined,'slide-line');line.append(el('span',String(i+1).padStart(2,'0'),'page-no'),el('span',slideTitle(s),'slide-name'));if(comments[s.id]?.text.trim()){const dot=el('span',undefined,'note-dot');dot.setAttribute('aria-label','有修改意见');line.append(dot);}btn.append(line);btn.addEventListener('click',()=>selectPage(i));list.append(btn);});if(!count)list.append(el('p','换个关键词继续查找。','no-results'));if(focused){const button=[...list.querySelectorAll('button')].find(b=>b.dataset.slideId===focused);button?.focus({preventScroll:true});}sidebar.scrollTop=oldTop;list.scrollLeft=oldLeft;}
function setTab(name,focus=false){activeTab=name;for(const n of ['notes','evidence','comments']){$('tab-'+n).setAttribute('aria-selected',String(n===name));$('tab-'+n).tabIndex=n===name?0:-1;$('panel-'+n).hidden=n!==name;}if(focus)$('tab-'+name).focus();}
function renderEvidence(s){const root=$('evidence');root.replaceChildren();if(!s.evidence?.length){root.append(el('p',s.reflection?'本页用于填写演讲者自己的思考。':'在此添加本页证据记录。','empty'));return;}for(const e of s.evidence){const article=el('article',undefined,'evidence-item');const badge=el('span',stateNames[e.status]||'待核查','state-label');badge.dataset.state=e.status;article.append(badge,el('p',e.claim,'claim'));const dl=el('dl',undefined,'fields');const labels={author_identity:'作者归属核对',locator:'原文位置',study_design:'研究设计',population:'分析人群',comparison:'比较对象',outcome:'结局指标',value:'数值',unit:'单位',denominator:'样本量 / 分母',timepoint:'时间点',uncertainty:'不确定性',derivation:'计算依据',interpretation:'表达性质',image_transform:'图像处理'};for(const [key,label]of Object.entries(labels)){if(e[key]!==undefined&&e[key]!==null&&e[key]!==''){dl.append(el('dt',label),el('dd',String(e[key])));}}article.append(dl);const source=sourceMap.get(e.source_id);if(source){const details=el('details',undefined,'source-details');details.append(el('summary','文献与来源信息'),el('p',source.citation),el('p','身份核查：'+stateNames[source.identity_status]));if(source.doi)details.append(el('p','DOI：'+source.doi));if(source.pmid)details.append(el('p','PMID：'+source.pmid));if(source.url&&/^https?:\/\//i.test(source.url)){const a=el('a','打开来源');a.href=source.url;a.target='_blank';a.rel='noopener noreferrer';details.append(a);}article.append(details);}root.append(article);}}
function renderComments(){const s=D.slides[page],c=comments[s.id];$('comment').value=c?.text||'';$('resolved').checked=c?.status==='resolved';$('resolved').disabled=!c?.text.trim();$('clear-comment').disabled=!c?.text;$('comment-context').textContent=`第 ${page+1} 页 · ${slideTitle(s)}`;updateSave();updateCount();}
function selectPage(i){page=Math.max(0,Math.min(D.slides.length-1,i));const s=D.slides[page];$('stage-title').textContent=slideTitle(s);$('counter').textContent=`${page+1} / ${D.slides.length}`;$('question').textContent=s.question;$('question').hidden=Boolean(s.subtitle)||imageOnlyCover(s);$('preview').src=s.image;$('preview').alt=`第 ${page+1} 页：${slideTitle(s)}，PPTX 实际渲染`;$('notes').textContent=s.notes;$('prev').disabled=page===0;$('next').disabled=page===D.slides.length-1;renderEvidence(s);renderComments();renderReflection();renderNav();try{history.replaceState(null,'','#'+s.id);}catch{}}
function download(bytes,name,mime){const blob=new Blob([bytes],{type:mime});const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function exportJSON(){download(JSON.stringify(exportObject(),null,2)+'\n',D.deck.id+'-'+D.deck.version+'-comments.json','application/json');message('修改清单已导出，可交给 Codex 更新 PPT。');}
function exportMarkdown(){const d=exportObject();let text=`# ${d.deck_title} · 修改清单\n\n文稿：${d.deck_id}\n版本：${d.version}\n内容指纹：${d.bundle_id}\nPPTX：${d.pptx_sha256}\n\n`;text+=d.comments.length?d.comments.map(c=>`## 第 ${c.slide_number} 页 · ${c.slide_title}\n\n页面标识：${c.slide_id}\n状态：${c.status==='resolved'?'已处理标记':'待处理'}\n\n${c.text}\n`).join('\n'):'暂无修改意见。\n';for(const r of d.reflections){const form=D.slides.find(s=>s.id===r.slide_id).reflection;text+=`\n## 第 ${r.slide_number} 页 · 演讲者感想\n\n选题方向：${r.direction||'自定主题'}\n自定主题：${r.custom_topic}\n\n`+form.prompts.map(p=>`### ${p.label}\n\n${r.answers[p.id]||'（待填写）'}\n`).join('\n');}download(text,D.deck.id+'-'+D.deck.version+'-comments.md','text/markdown;charset=utf-8');message('已导出文字清单，可交给 Codex 继续修改。');}
function editComment(){const s=D.slides[page],text=$('comment').value;comments[s.id]={slide_id:s.id,text,status:text.trim()&&$('resolved').checked?'resolved':'open',updated_at:new Date().toISOString()};$('resolved').disabled=!text.trim();$('clear-comment').disabled=!text;$('resolved').checked=comments[s.id].status==='resolved';persist();}
$('comment').addEventListener('input',editComment);$('resolved').addEventListener('change',editComment);
$('clear-comment').addEventListener('click',async()=>{const previous=comments[D.slides[page].id];if(!previous)return;if(!await askConfirm('清空本页意见？其他页面意见会保留。'))return;delete comments[D.slides[page].id];persist();renderComments();});
async function importBackup(raw){const incoming=JSON.parse(raw);if(incoming.schema_version!==1||incoming.deck_id!==D.deck.id||incoming.version!==D.deck.version||incoming.bundle_id!==D.bundle_id||incoming.pptx_sha256!==D.pptx_sha256)throw Error('文稿或版本不匹配，请打开这份清单对应的审阅台');const parsed=validateComments(incoming.comments),incomingReflections=validateReflections(incoming.reflections);const conflictCount=Object.values(parsed).filter(c=>comments[c.slide_id]?.text.trim()&&(comments[c.slide_id].text!==c.text||comments[c.slide_id].status!==c.status)).length+Object.values(incomingReflections).filter(r=>reflections[r.slide_id]&&(reflections[r.slide_id].direction||reflections[r.slide_id].custom_topic.trim()||Object.values(reflections[r.slide_id].answers).some(v=>v.trim()))&&(JSON.stringify(reflections[r.slide_id].answers)!==JSON.stringify(r.answers)||reflections[r.slide_id].direction!==r.direction||reflections[r.slide_id].custom_topic!==r.custom_topic)).length;if(conflictCount&&!await askConfirm(`导入将替换 ${conflictCount} 项已有记录，其余内容会保留。建议先导出当前清单备份，是否继续？`))return;for(const [key,value]of Object.entries(parsed))comments[key]=value;for(const [key,value]of Object.entries(incomingReflections))reflections[key]=value;persist();renderComments();renderReflection();message(`已导入 ${Object.keys(parsed).length} 页意见与 ${Object.keys(incomingReflections).length} 页感想。`);}

$('import-file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('文件超过 2 MB');await importBackup(await file.text());}catch(e){message('导入失败：'+e.message);}finally{event.target.value='';}});
$('import-text-button').addEventListener('click',async()=>{try{await importBackup($('import-text').value);}catch(e){message('导入失败：'+e.message);}});
$('export-top').addEventListener('click',exportJSON);$('export-json').addEventListener('click',exportJSON);$('export-md').addEventListener('click',exportMarkdown);$('search').addEventListener('input',renderNav);$('prev').addEventListener('click',()=>selectPage(page-1));$('next').addEventListener('click',()=>selectPage(page+1));
for(const name of ['notes','evidence','comments']){$('tab-'+name).addEventListener('click',()=>setTab(name));$('tab-'+name).addEventListener('keydown',e=>{const names=['notes','evidence','comments'];if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const index=e.key==='Home'?0:e.key==='End'?2:(names.indexOf(name)+(e.key==='ArrowRight'?1:2))%3;setTab(names[index],true);}});}
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||($('zoom-dialog').open||$('confirm-dialog').open)||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.closest('[role="tablist"]')||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();selectPage(page+(e.key==='ArrowRight'?1:-1));}});
function zoom(){const s=D.slides[page];$('zoom-title').textContent=`第 ${page+1} 页 · ${slideTitle(s)}`;$('zoom-image').src=s.image;$('zoom-image').alt=slideTitle(s);$('zoom-range').value=100;$('zoom-image').style.width='100%';$('zoom-value').textContent='100%';$('zoom-dialog').showModal();$('close-zoom').focus();}
$('zoom-preview').addEventListener('click',zoom);$('zoom-button').addEventListener('click',zoom);$('close-zoom').addEventListener('click',()=>$('zoom-dialog').close());$('zoom-range').addEventListener('input',e=>{$('zoom-image').style.width=e.target.value+'%';$('zoom-value').textContent=e.target.value+'%';});
for(const item of D.downloads){const button=el('button',item.label);button.addEventListener('click',()=>{const a=document.createElement('a');a.href=item.href;a.download=item.filename;document.body.append(a);a.click();a.remove();$('downloads').open=false;});$('download-menu').append(button);}
document.title=D.deck.title+' · 审阅台';$('deck-title').textContent=D.deck.title;$('deck-meta').textContent=`${D.deck.version} · ${D.slides.length} 页 · 本地离线审阅`;$('total-count').textContent=D.slides.length+' 页';$('sample-banner').hidden=D.deck.mode!=='test_fixture';
let summary=[];for(const [name,label]of [['evidence','医学证据'],['file','文件与可编辑性'],['visual','逐页视觉']]){const c=D.checks[name],shownLabel=name==='evidence'&&D.deck.mode==='test_fixture'?'素材类型':label,shownState=name==='evidence'&&D.deck.mode==='test_fixture'?'演示数据':reviewNames[c.status];summary.push(shownLabel+'：'+shownState);const row=el('div',undefined,'check-item');row.append(el('strong',shownLabel));const status=el('span',shownState,'check-state');status.dataset.state=c.status;row.append(status,el('p',c.note));$('check-grid').append(row);}$('check-summary').textContent=summary.filter(x=>!x.endsWith('：通过')).join(' · ')||'三项均已记录通过';$('render-info').textContent=`预览生成：${D.render_info.renderer} · ${D.render_info.rendered_at.slice(0,10)}`;
const initial=D.slides.findIndex(s=>'#'+s.id===location.hash);selectPage(initial<0?0:initial);
</script>
